# PR 质量门禁：build、migration-guard 在分支保护中设为必须通过。
# action 版本规则：GitHub 官方 action 用主版本标签；第三方 action 一律锁 commit SHA（防供应链投毒）。
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 最小权限：只读代码
permissions:
  contents: read

# 同一分支推了新提交时，取消还在跑的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史，才能和目标分支比较出改了哪些文件
          fetch-depth: 0

      # 只改 docs/ 或 *.md 的 PR 跳过编译和测试；job 仍然运行并报成功，
      # 否则必须通过的 build 检查不会上报，PR 无法合并。推送到 dev / main 始终完整构建。
      - name: Detect docs-only change
        id: scope
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/docs-only.sh origin/${{ github.base_ref }} >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.scope.outputs.docs_only != 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # runner 自带 Docker，Testcontainers 会在这里启动真实 MySQL
      - name: Build and test
        if: steps.scope.outputs.docs_only != 'true'
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: services/*/target/surefire-reports/
          retention-days: 7

  migration-guard:
    name: migration-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史，才能和目标分支比较
          fetch-depth: 0

      - name: Check Flyway migrations
        run: bash scripts/ci/check-migrations.sh origin/${{ github.base_ref }}
